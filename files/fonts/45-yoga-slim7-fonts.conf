<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Windows-familiar fonts</description>
  <!-- Installed by yoga-slim7-ubuntu/install.sh. -->

  <!-- Generic names: what an application gets when it asks for "a sans-serif
       font" or "a monospace font" without naming one. Consolas is only used
       when it is installed; otherwise the system's own monospace font stays. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Consolas</family></prefer>
  </alias>

  <!-- Names that web pages and Windows-first applications ask for.
       "prefer" (not "accept") matters: browsers only take a substitute when it
       is the FIRST family after substitution. Teams, Outlook, WhatsApp and
       GitHub all ask for Segoe UI first; Selawik is Microsoft's open stand-in
       with the same letter widths, so their layouts stay as on Windows. -->
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
</fontconfig>
