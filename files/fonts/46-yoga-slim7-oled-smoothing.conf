<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Greyscale text smoothing for OLED panels</description>
  <!-- Installed by yoga-slim7-ubuntu/install.sh, on laptops with an OLED screen only. -->

  <!-- Colour ("subpixel") smoothing assumes red, green and blue stripes side
       by side, as on an LCD. OLED laptop panels do not lay their subpixels out
       that way, so colour smoothing puts coloured edges on letters. -->
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
